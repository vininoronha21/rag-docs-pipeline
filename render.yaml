services:
  - type: web
    name: rag-docs-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: 'sh -c "python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"'
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: LLM_PROVIDER
        value: extractive
