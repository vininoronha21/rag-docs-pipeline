name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing smoke URLs and questions.
        required: true
        default: production
        type: environment

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: rag_docs_test
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag_docs_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: pytest backend/tests --ignore=backend/tests/integration
      - run: pytest backend/tests/integration -m integration
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag_docs_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build

  post-deploy-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke.sh
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SMOKE_ANSWERABLE_QUESTION: ${{ secrets.SMOKE_ANSWERABLE_QUESTION }}
          SMOKE_UNSUPPORTED_QUESTION: ${{ secrets.SMOKE_UNSUPPORTED_QUESTION }}
